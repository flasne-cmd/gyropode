[env:esp32dev]
; Fork pioarduino : nécessaire pour le coeur Arduino ESP32 3.x, dont l'API
; ledcAttach(broche, frequence, resolution) utilisée par src/main.cpp.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; Wi-Fi + WebSocket + Adafruit MPU6050 dépassent la partition par défaut
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    links2004/WebSockets@^2.4.1
